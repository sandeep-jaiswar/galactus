name: Build Research (Python)

on:
  push:
    branches: [ production ]
    paths:
      - 'research/python/**'
      - '.github/workflows/build-research.yml'
  pull_request:
    branches: [ production ]
    paths:
      - 'research/python/**'
      - '.github/workflows/build-research.yml'

jobs:
  build-and-test:
    name: Build and Test Research
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Poetry virtual environment
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('research/python/pyproject.toml') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create false

      - name: Install dependencies
        working-directory: research/python
        run: poetry install --no-dev

      - name: Install dev dependencies
        working-directory: research/python
        run: poetry install

      - name: Run tests
        working-directory: research/python
        run: poetry run pytest tests/ -v

      - name: Install linting tools
        run: |
          python -m pip install black isort flake8 mypy

      - name: Check code formatting (Black)
        working-directory: research/python
        run: black --check --diff --line-length 88 src/ tests/

      - name: Check import sorting (isort)
        working-directory: research/python
        run: isort --check-only --diff --profile black src/ tests/

      - name: Lint code (flake8)
        working-directory: research/python
        run: flake8 --max-line-length 88 --extend-ignore E203,W503 src/ tests/

      - name: Type check (mypy)
        working-directory: research/python
        run: mypy --ignore-missing-imports --no-strict-optional --disable-error-code=import src/ tests/
        continue-on-error: true