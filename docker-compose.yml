version: '3.8'

services:
  # Galactus application
  galactus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galactus-app
    environment:
      - GALACTUS_PROJECT_ROOT=/app
      - GALACTUS_DATA_ROOT=/app/data
      - GALACTUS_LOG_DIR=/app/logs
      - GALACTUS_LOG_LEVEL=INFO
      - HUDI_BASE_PATH=/app/data/silver
      - SPARK_MASTER=local[*]
      - SPARK_DRIVER_MEMORY=2g
      - SPARK_EXECUTOR_MEMORY=2g
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=galactus
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./jobs:/app/jobs
      - ./utils:/app/utils
      - ./conf:/app/conf
    depends_on:
      - clickhouse
    networks:
      - galactus-network
    command: tail -f /dev/null

  # ClickHouse for analytics
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: galactus-clickhouse
    environment:
      - CLICKHOUSE_DB=galactus
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    networks:
      - galactus-network

  # Hive Metastore (optional - for production use)
  # metastore:
  #   image: apache/hive:3.1.3
  #   container_name: galactus-metastore
  #   environment:
  #     - SERVICE_NAME=metastore
  #   ports:
  #     - "9083:9083"
  #   networks:
  #     - galactus-network

volumes:
  clickhouse-data:
  clickhouse-logs:

networks:
  galactus-network:
    driver: bridge
