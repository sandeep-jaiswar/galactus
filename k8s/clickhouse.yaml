apiVersion: v1
kind: Namespace
metadata:
  name: galactus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: galactus
spec:
  serviceName: clickhouse-service
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:latest
        ports:
        - containerPort: 8123
          name: http
        - containerPort: 9000
          name: native
        env:
        - name: CLICKHOUSE_DB
          value: "galactus"
        # SECURITY: For production, use Kubernetes Secrets for credentials
        # Create a secret: kubectl create secret generic clickhouse-credentials \
        #   --from-literal=username=galactus_user \
        #   --from-literal=password=<strong-password>
        # Then reference it here:
        # - name: CLICKHOUSE_USER
        #   valueFrom:
        #     secretKeyRef:
        #       name: clickhouse-credentials
        #       key: username
        # - name: CLICKHOUSE_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: clickhouse-credentials
        #       key: password
        - name: CLICKHOUSE_USER
          value: "default"
        volumeMounts:
        - name: clickhouse-data
          mountPath: /var/lib/clickhouse
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
  volumeClaimTemplates:
  - metadata:
      name: clickhouse-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-service
  namespace: galactus
spec:
  selector:
    app: clickhouse
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 9000
    targetPort: 9000
  type: ClusterIP
