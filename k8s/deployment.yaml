apiVersion: apps/v1
kind: Deployment
metadata:
  name: galactus-app
  namespace: galactus
  labels:
    app: galactus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: galactus
  template:
    metadata:
      labels:
        app: galactus
    spec:
      containers:
      - name: galactus
        # IMPORTANT: Use specific version tags in production, not 'latest'
        # Example: galactus:v1.0.0 or galactus@sha256:abc123...
        image: galactus:latest
        # Use 'Always' pull policy in production with version tags
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: galactus-config
        env:
        - name: GALACTUS_PROJECT_ROOT
          value: "/app"
        - name: GALACTUS_DATA_ROOT
          value: "/app/data"
        - name: GALACTUS_LOG_DIR
          value: "/app/logs"
        - name: HUDI_BASE_PATH
          value: "/app/data/silver"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: logs-volume
          mountPath: /app/logs
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: galactus-data-pvc
      - name: logs-volume
        persistentVolumeClaim:
          claimName: galactus-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: galactus-service
  namespace: galactus
spec:
  selector:
    app: galactus
  ports:
  - name: spark-ui
    port: 4040
    targetPort: 4040
  type: ClusterIP
