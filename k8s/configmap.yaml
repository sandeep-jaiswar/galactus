apiVersion: v1
kind: ConfigMap
metadata:
  name: galactus-config
  namespace: galactus
data:
  # Application configuration
  GALACTUS_LOG_LEVEL: "INFO"
  SPARK_MASTER: "local[*]"
  SPARK_DRIVER_MEMORY: "4g"
  SPARK_EXECUTOR_MEMORY: "4g"
  
  # ClickHouse configuration
  CLICKHOUSE_HOST: "clickhouse-service"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: "galactus"
  
  # NSE download configuration
  NSE_DOWNLOAD_TIMEOUT: "30"
  NSE_RETRY_ATTEMPTS: "3"
  NSE_RETRY_DELAY: "5"
