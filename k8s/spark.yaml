apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: bhavcopy-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
      - name: spark-master
        image: bhavcopy-spark:latest
        command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
        ports:
        - containerPort: 7077
        - containerPort: 8080
        volumeMounts:
        - name: data
          mountPath: /opt/spark/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: bhavcopy-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
      - name: spark-worker
        image: bhavcopy-spark:latest
        command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
        volumeMounts:
        - name: data
          mountPath: /opt/spark/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-service
  namespace: bhavcopy-pipeline
spec:
  selector:
    app: spark-master
  ports:
  - port: 7077
    targetPort: 7077
  - port: 8080
    targetPort: 8080
  type: ClusterIP