[package]
name = "galactus-core"
version = "0.1.0"
edition = "2021"
authors = ["Galactus Team"]
description = "Galactus production inference engine - deterministic capital pressure inference"
license = "TBD"

# Production inference engine
# All dependencies must be justified and deterministic

[dependencies]
# Core functionality (to be added as needed after promotion)
# serde = { version = "1.0", features = ["derive"] }  # Serialization
# tokio = { version = "1", features = ["full"] }      # Async runtime
# polars = "0.35"                                      # Data processing

[dev-dependencies]
# Testing utilities
# criterion = "0.5"  # Benchmarking

[lib]
name = "galactus_core"
path = "src/lib.rs"

# Production build profile - optimize for correctness, then speed
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'

# Note: All dependencies require justification in comments
# See: docs/02-system-architecture/rust-python-boundary-enforcement.md
