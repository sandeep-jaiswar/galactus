# =============================================================================
implementation_notes: |
  ## Rust Implementation Requirements
  - Add hedge pressure computation to core/rust/src/features/
  - Implement option chain parsing in Rust
  - Integrate with intent engine for directional bias
  - Add comprehensive unit tests

  ## Data Dependencies
  - NSE option chain data (calls and puts)
  - Real-time OI updates
  - Strike price proximity calculations

  ## Performance Requirements
  - Signal computation < 50ms
