version: "3.8"

services:
  galactus-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    ports:
      - "8080:8080"
      - "50051:9090"  # gRPC mapped to host port 50051 to avoid conflict with Prometheus
    environment:
      - RUST_LOG=warn
      - GALACTUS_ENV=production
      - GALACTUS_METRICS_ENABLED=true
    volumes:
      - ./logs:/app/logs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - galactus-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=720h"
      - "--web.enable-lifecycle"
    restart: always
    networks:
      - galactus-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana_dashboard.json:/etc/grafana/dashboards/galactus.json:ro
    restart: always
    depends_on:
      - prometheus
    networks:
      - galactus-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  galactus-network:
    driver: bridge
